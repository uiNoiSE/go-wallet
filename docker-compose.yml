services:
  wallet_postgres:
    image: postgres:18-alpine
    container_name: wallet_postgres
    env_file:
      - config.env
    ports:
      - "5432:5432"
    volumes:
      - go-wallet_pgdata:/var/lib/postgresql
    networks:
      - wallet_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  wallet_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet_app
    ports:
      - "8080:8080"
    env_file:
      - config.env
    environment:
      DB_HOST: wallet_postgres
    depends_on:
      wallet_postgres:
        condition: service_healthy
    networks:
      - wallet_network

networks:
  wallet_network:
    name: go-wallet_network
    driver: bridge

volumes:
  go-wallet_pgdata:
    name: go-wallet_pgdata

