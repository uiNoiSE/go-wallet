services:
  postgres:
    image: postgres:15-alpine
    container_name: wallet_postgres
    env_file:
      - config.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

